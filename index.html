<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Rueda v0.3</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root{
      --y:#ffd400;--bg:#101010;--card:#1b1b1f;--card2:#25252b;--text:#fff;
      --muted:#b8b8bf;--line:#3a3a42;--ok:#54e49a;--danger:#ff7f7f;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{min-height:100vh}
    main{max-width:560px;margin:auto;min-height:100vh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
    button,input,select{font:inherit}
    button{cursor:pointer}
    header{display:flex;justify-content:space-between;align-items:center}
    .brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:900}
    .logo{width:48px;height:48px;border-radius:15px;background:var(--y);color:#111;display:grid;place-items:center;font-weight:900}
    .ver,.pill{background:var(--card2);color:var(--muted);padding:8px 12px;border-radius:999px}
    .hero{padding:25px 5px 12px}
    .hero h1{font-size:38px;line-height:1.05;margin:0 0 10px;letter-spacing:-1px}
    .muted{color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:23px;padding:18px;margin-top:15px;box-shadow:0 14px 30px rgba(0,0,0,.24)}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:var(--card2);padding:6px;border-radius:16px}
    .tab{border:0;background:transparent;color:var(--muted);padding:12px;border-radius:12px;font-weight:900}
    .tab.on{background:var(--y);color:#111}
    label{display:block;color:var(--muted);font-size:13px;font-weight:800;margin:13px 0 7px}
    input,select{width:100%;padding:14px;background:#101012;color:#fff;border:1px solid var(--line);border-radius:14px;outline:none}
    input:focus,select:focus{border-color:var(--y);box-shadow:0 0 0 3px rgba(255,212,0,.12)}
    .primary,.secondary{width:100%;padding:15px;border-radius:15px;font-weight:900;margin-top:12px}
    .primary{border:0;background:var(--y);color:#111}
    .secondary{background:var(--card2);border:1px solid var(--line);color:#fff}
    .small{width:auto;padding:10px 12px;margin:0}
    .hidden{display:none!important}
    .msg{display:none;padding:12px;border-radius:13px;margin-top:12px}
    .msg.ok{display:block;background:#123c29;color:#8ef0ba;border:1px solid #2e7954}
    .msg.err{display:block;background:#442020;color:#ffaaaa;border:1px solid #7b3535}
    .homeHead{display:flex;justify-content:space-between;align-items:flex-start;margin:12px 0}
    .homeHead h2{font-size:30px;margin:0 0 4px}
    #map{height:330px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#222}
    .mapBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .vehicles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .vehicle{background:var(--card2);border:1px solid var(--line);color:#fff;border-radius:15px;padding:12px 6px}
    .vehicle.on{border-color:var(--y);color:var(--y);background:#3a3310}
    .vehicle b{display:block;font-size:24px}
    .fare,.status,.ride{background:#111;border:1px dashed #4a4a52;border-radius:16px;padding:15px;margin-top:13px}
    .fare{display:flex;justify-content:space-between;align-items:center}
    .fare strong{color:var(--y);font-size:23px}
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .metric{background:#111;border:1px solid var(--line);border-radius:15px;padding:12px}
    .metric small{display:block;color:var(--muted);margin-bottom:4px}
    .metric strong{font-size:18px}
    .ride{border-style:solid}
    .driverRow{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:10px}
    .driverBadge{display:flex;align-items:center;gap:10px}
    .avatar{width:44px;height:44px;border-radius:50%;background:var(--y);color:#111;display:grid;place-items:center;font-weight:900}
    .progress{height:8px;background:#2a2a30;border-radius:999px;overflow:hidden;margin-top:12px}
    .progress > div{height:100%;width:0;background:var(--y);transition:width .4s}
    .foot{text-align:center;color:#777780;font-size:12px;padding:20px}
    .leaflet-div-icon{background:transparent;border:0}
    .driverIcon{width:34px;height:34px;border-radius:50%;background:#111;border:3px solid var(--y);display:grid;place-items:center;font-size:18px;box-shadow:0 3px 12px rgba(0,0,0,.45)}
    .destIcon{width:30px;height:30px;border-radius:50% 50% 50% 0;background:#ff4d4d;transform:rotate(-45deg);border:3px solid #fff}
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand"><div class="logo">R</div>Rueda</div>
    <div class="ver">v0.3</div>
  </header>

  <section id="auth">
    <div class="hero">
      <h1>Muévete fácil por Ciego de Ávila.</h1>
      <div class="muted">Ahora con distancia real, conductores cercanos y llegada simulada.</div>
    </div>
    <div class="card">
      <div class="tabs">
        <button id="tLogin" class="tab on" type="button">Entrar</button>
        <button id="tRegister" class="tab" type="button">Crear cuenta</button>
      </div>

      <form id="fLogin">
        <label for="le">Correo</label><input id="le" type="email" required>
        <label for="lp">Contraseña</label><input id="lp" type="password" minlength="4" required>
        <button class="primary">Iniciar sesión</button>
        <div id="lm" class="msg"></div>
      </form>

      <form id="fRegister" class="hidden">
        <label for="rn">Nombre</label><input id="rn" required>
        <label for="re">Correo</label><input id="re" type="email" required>
        <label for="rp">Contraseña</label><input id="rp" type="password" minlength="4" required>
        <label for="rr">Tipo de cuenta</label>
        <select id="rr">
          <option value="pasajero">Pasajero</option>
          <option value="conductor">Conductor</option>
        </select>
        <div id="vf" class="hidden">
          <label for="rv">Vehículo</label>
          <select id="rv">
            <option value="motorina">Motorina</option>
            <option value="moto">Moto</option>
            <option value="triciclo">Triciclo</option>
          </select>
        </div>
        <button class="primary">Crear cuenta</button>
        <div id="rm" class="msg"></div>
      </form>
    </div>
  </section>

  <section id="passenger" class="hidden">
    <div class="homeHead">
      <div><h2 id="pg">Hola</h2><div class="muted">Toca el mapa para elegir destino.</div></div>
      <button id="plo" class="secondary small" type="button">Salir</button>
    </div>

    <div id="map"></div>
    <div class="mapBtns">
      <button id="loc" class="secondary" type="button">📍 Mi ubicación</button>
      <button id="center" class="secondary" type="button">🏙️ Centro</button>
    </div>

    <div class="card">
      <label for="pickup">Recogida</label>
      <input id="pickup" value="Mi ubicación">

      <label for="dest">Destino</label>
      <input id="dest" placeholder="Toca el mapa o escribe un lugar">

      <label>Vehículo</label>
      <div class="vehicles">
        <button class="vehicle on" data-v="motorina" data-p="90" data-km="35" type="button"><b>🛵</b>Motorina</button>
        <button class="vehicle" data-v="moto" data-p="120" data-km="45" type="button"><b>🏍️</b>Moto</button>
        <button class="vehicle" data-v="triciclo" data-p="170" data-km="60" type="button"><b>🛺</b>Triciclo</button>
      </div>

      <div class="metrics">
        <div class="metric"><small>Distancia</small><strong id="distanceText">—</strong></div>
        <div class="metric"><small>Tiempo estimado</small><strong id="etaText">—</strong></div>
      </div>

      <div class="fare"><span>Precio estimado</span><strong id="fare">90 CUP</strong></div>
      <button id="request" class="primary" type="button">Pedir viaje</button>
      <div id="pm" class="msg"></div>
      <div id="pstatus" class="status hidden"></div>
    </div>
  </section>

  <section id="driver" class="hidden">
    <div class="homeHead">
      <div><h2 id="dg">Hola</h2><div id="ds" class="muted">Modo conductor</div></div>
      <button id="dlo" class="secondary small" type="button">Salir</button>
    </div>
    <div class="card">
      <button id="refresh" class="primary" type="button">Actualizar solicitudes</button>
      <div id="rides"></div>
    </div>
  </section>

  <div class="foot">Versión privada de prueba · Los viajes siguen siendo simulados.</div>
</main>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const UK="rueda_users_v01",SK="rueda_session_v01",RK="rueda_rides_v03";
let user=null,map=null,userMarker=null,destMarker=null,routeLine=null;
let pickupLatLng={lat:21.84,lng:-78.7619},destLatLng=null;
let vehicle="motorina",baseFare=90,priceKm=35;
let simulatedDrivers=[],driverMarkers=[],movementTimer=null;

const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}};
const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const users=()=>get(UK,[]);
const rides=()=>get(RK,[]);
const hideAll=()=>["auth","passenger","driver"].forEach(id=>$(id).classList.add("hidden"));
const msg=(el,text,ok)=>{el.textContent=text;el.className="msg "+(ok?"ok":"err")};

function switchTab(login){
  $("tLogin").classList.toggle("on",login);
  $("tRegister").classList.toggle("on",!login);
  $("fLogin").classList.toggle("hidden",!login);
  $("fRegister").classList.toggle("hidden",login);
}
function showAuth(){hideAll();$("auth").classList.remove("hidden");switchTab(true)}
function openApp(u){
  user=u;hideAll();
  if(u.role==="conductor"){
    $("driver").classList.remove("hidden");
    $("dg").textContent="Hola, "+u.name;
    $("ds").textContent="Conductor de "+(u.vehicle||"vehículo");
    renderDriver();
  }else{
    $("passenger").classList.remove("hidden");
    $("pg").textContent="Hola, "+u.name;
    setTimeout(initMap,120);
    renderPassenger();
  }
}
function logout(){localStorage.removeItem(SK);user=null;showAuth()}

$("tLogin").onclick=()=>switchTab(true);
$("tRegister").onclick=()=>switchTab(false);
$("rr").onchange=()=>$("vf").classList.toggle("hidden",$("rr").value!=="conductor");

$("fRegister").onsubmit=e=>{
  e.preventDefault();
  const us=users(),email=$("re").value.trim().toLowerCase();
  if(us.some(x=>x.email===email)){msg($("rm"),"Ese correo ya existe.",false);return}
  const u={id:Date.now(),name:$("rn").value.trim(),email,password:$("rp").value,role:$("rr").value,vehicle:$("rr").value==="conductor"?$("rv").value:""};
  us.push(u);set(UK,us);localStorage.setItem(SK,u.id);openApp(u);
};
$("fLogin").onsubmit=e=>{
  e.preventDefault();
  const u=users().find(x=>x.email===$("le").value.trim().toLowerCase()&&x.password===$("lp").value);
  if(!u){msg($("lm"),"Correo o contraseña incorrectos.",false);return}
  localStorage.setItem(SK,u.id);openApp(u);
};
$("plo").onclick=$("dlo").onclick=logout;

function initMap(){
  if(map){map.invalidateSize();return}
  map=L.map("map",{zoomControl:false}).setView([21.84,-78.7619],14);
  L.control.zoom({position:"bottomright"}).addTo(map);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  userMarker=L.marker([pickupLatLng.lat,pickupLatLng.lng]).addTo(map).bindPopup("Punto de recogida");
  createSimulatedDrivers();
  map.on("click",e=>setDestination(e.latlng,"Destino marcado en el mapa"));
}

function createDriverIcon(type){
  const emoji=type==="triciclo"?"🛺":type==="moto"?"🏍️":"🛵";
  return L.divIcon({className:"",html:"<div class='driverIcon'>"+emoji+"</div>",iconSize:[34,34],iconAnchor:[17,17]});
}
function createSimulatedDrivers(){
  simulatedDrivers=[
    {id:1,name:"Carlos",type:"motorina",rating:4.9,lat:21.8432,lng:-78.7595},
    {id:2,name:"Luis",type:"moto",rating:4.8,lat:21.8368,lng:-78.7672},
    {id:3,name:"Ana",type:"triciclo",rating:4.9,lat:21.8470,lng:-78.7700},
    {id:4,name:"Miguel",type:"moto",rating:4.7,lat:21.8390,lng:-78.7540}
  ];
  driverMarkers=simulatedDrivers.map(d=>L.marker([d.lat,d.lng],{icon:createDriverIcon(d.type)}).addTo(map).bindPopup(d.name+" · "+d.type+" · ⭐ "+d.rating));
}
function setDestination(latlng,label){
  destLatLng={lat:latlng.lat,lng:latlng.lng};
  if(destMarker)destMarker.remove();
  destMarker=L.marker(latlng).addTo(map).bindPopup("Destino").openPopup();
  $("dest").value=label;
  drawRoute();recalculate();
}
function drawRoute(){
  if(!destLatLng)return;
  if(routeLine)routeLine.remove();
  routeLine=L.polyline([[pickupLatLng.lat,pickupLatLng.lng],[destLatLng.lat,destLatLng.lng]],{weight:5,opacity:.85}).addTo(map);
  map.fitBounds(routeLine.getBounds(),{padding:[35,35]});
}
function kmBetween(a,b){
  const R=6371,toRad=x=>x*Math.PI/180;
  const dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng);
  const q=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(q));
}
function recalculate(){
  if(!destLatLng){
    $("distanceText").textContent="—";$("etaText").textContent="—";$("fare").textContent=baseFare+" CUP";return;
  }
  const km=Math.max(.5,kmBetween(pickupLatLng,destLatLng)*1.25);
  const mins=Math.max(3,Math.round(km/22*60));
  const total=Math.round(baseFare+km*priceKm);
  $("distanceText").textContent=km.toFixed(1)+" km";
  $("etaText").textContent=mins+" min";
  $("fare").textContent=total+" CUP";
}
$("loc").onclick=()=>{
  if(!navigator.geolocation){msg($("pm"),"Ubicación no disponible.",false);return}
  navigator.geolocation.getCurrentPosition(p=>{
    pickupLatLng={lat:p.coords.latitude,lng:p.coords.longitude};
    map.setView([pickupLatLng.lat,pickupLatLng.lng],16);
    if(userMarker)userMarker.remove();
    userMarker=L.marker([pickupLatLng.lat,pickupLatLng.lng]).addTo(map).bindPopup("Tu ubicación").openPopup();
    $("pickup").value="Mi ubicación actual";
    if(destLatLng){drawRoute();recalculate()}
    msg($("pm"),"Ubicación encontrada.",true);
  },()=>msg($("pm"),"Activa el permiso de ubicación en Safari.",false),{enableHighAccuracy:true,timeout:10000});
};
$("center").onclick=()=>map.setView([21.84,-78.7619],14);
document.querySelectorAll(".vehicle").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".vehicle").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");vehicle=b.dataset.v;baseFare=+b.dataset.p;priceKm=+b.dataset.km;recalculate();
});
$("dest").onchange=()=>{
  if($("dest").value.trim()&&!destLatLng){
    setDestination({lat:21.846,lng:-78.7635},$("dest").value.trim());
  }
};

$("request").onclick=()=>{
  if(!destLatLng){
    if(!$("dest").value.trim()){msg($("pm"),"Toca el mapa o escribe un destino.",false);return}
    setDestination({lat:21.846,lng:-78.7635},$("dest").value.trim());
  }
  const rs=rides();
  if(rs.some(r=>r.passengerId===user.id&&["pendiente","aceptado","llegando"].includes(r.status))){
    msg($("pm"),"Ya tienes un viaje activo.",false);return;
  }
  const dist=parseFloat($("distanceText").textContent)||1;
  const fare=+($("fare").textContent.replace(/\D/g,""));
  const ride={id:Date.now(),passengerId:user.id,passengerName:user.name,pickup:$("pickup").value,destination:$("dest").value,vehicle,fare,distance:dist,status:"pendiente",driverId:null,driverName:null,driverRating:null,progress:0};
  rs.push(ride);set(RK,rs);msg($("pm"),"Solicitud enviada. Buscando conductor…",true);renderPassenger();
  setTimeout(()=>autoAssignDriver(ride.id),1800);
};

function autoAssignDriver(id){
  const rs=rides(),r=rs.find(x=>x.id===id);
  if(!r||r.status!=="pendiente")return;
  const matching=simulatedDrivers.filter(d=>d.type===r.vehicle);
  const chosen=(matching[0]||simulatedDrivers[0]);
  r.status="aceptado";r.driverId="sim-"+chosen.id;r.driverName=chosen.name;r.driverRating=chosen.rating;r.driverLat=chosen.lat;r.driverLng=chosen.lng;r.progress=0;
  set(RK,rs);renderPassenger();startMovement(id,chosen);
}
function startMovement(id,driver){
  if(movementTimer)clearInterval(movementTimer);
  const movingMarker=L.marker([driver.lat,driver.lng],{icon:createDriverIcon(driver.type)}).addTo(map).bindPopup(driver.name+" viene en camino");
  movementTimer=setInterval(()=>{
    const rs=rides(),r=rs.find(x=>x.id===id);
    if(!r||!["aceptado","llegando"].includes(r.status)){clearInterval(movementTimer);movingMarker.remove();return}
    r.progress=Math.min(100,(r.progress||0)+8);
    const t=r.progress/100;
    const lat=driver.lat+(pickupLatLng.lat-driver.lat)*t;
    const lng=driver.lng+(pickupLatLng.lng-driver.lng)*t;
    movingMarker.setLatLng([lat,lng]);
    if(r.progress>=65)r.status="llegando";
    if(r.progress>=100){r.status="en_punto";clearInterval(movementTimer)}
    set(RK,rs);renderPassenger();
  },900);
}

function updateRide(id,status){
  const rs=rides(),r=rs.find(x=>x.id===id);if(!r)return;
  r.status=status;set(RK,rs);renderPassenger();renderDriver();
}
function renderPassenger(){
  if(!user)return;
  const r=rides().slice().reverse().find(x=>x.passengerId===user.id&&x.status!=="cancelado");
  const box=$("pstatus");
  if(!r){box.classList.add("hidden");return}
  box.classList.remove("hidden");
  if(r.status==="pendiente"){
    box.innerHTML="<b>🔎 Buscando conductor</b><div class='muted'>"+r.vehicle+" · "+r.fare+" CUP · "+r.distance+" km</div><button id='cancel' class='secondary'>Cancelar</button>";
    $("cancel").onclick=()=>updateRide(r.id,"cancelado");
  }else if(["aceptado","llegando"].includes(r.status)){
    const eta=Math.max(1,Math.ceil((100-(r.progress||0))/20));
    box.innerHTML="<div class='driverRow'><div class='driverBadge'><div class='avatar'>"+(r.driverName||"C")[0]+"</div><div><b>"+r.driverName+"</b><div class='muted'>⭐ "+r.driverRating+" · "+r.vehicle+"</div></div></div><strong>"+eta+" min</strong></div><div class='progress'><div style='width:"+(r.progress||0)+"%'></div></div><div class='muted' style='margin-top:10px'>"+(r.status==="llegando"?"El conductor está cerca.":"El conductor viene hacia ti.")+"</div>";
  }else if(r.status==="en_punto"){
    box.innerHTML="<b>📍 Tu conductor llegó</b><div class='muted'>"+r.driverName+" está en el punto de recogida.</div><button id='finish' class='primary'>Comenzar y finalizar prueba</button>";
    $("finish").onclick=()=>updateRide(r.id,"completado");
  }else{
    box.innerHTML="<b>🏁 Viaje de prueba terminado</b><div class='muted'>Ya puedes pedir otro viaje.</div>";
  }
}
$("refresh").onclick=renderDriver;
function renderDriver(){
  if(!user||user.role!=="conductor")return;
  const rs=rides().filter(r=>r.status==="pendiente"||r.driverId===user.id).reverse();
  $("rides").innerHTML=rs.length?rs.map(r=>"<div class='ride'><b>"+r.passengerName+"</b><div class='muted'>📍 "+r.pickup+"<br>🏁 "+r.destination+"<br>"+r.vehicle+" · "+r.fare+" CUP · "+r.distance+" km</div>"+(r.status==="pendiente"?"<button class='primary accept' data-id='"+r.id+"'>Aceptar viaje</button>":"<div class='msg ok'>Viaje "+r.status+"</div>")+"</div>").join(""):"<div class='status'><b>No hay solicitudes</b><div class='muted'>Pulsa actualizar cuando un pasajero pida un viaje.</div></div>";
  document.querySelectorAll(".accept").forEach(b=>b.onclick=()=>{
    const all=rides(),r=all.find(x=>x.id===+b.dataset.id);if(!r)return;
    r.status="aceptado";r.driverId=user.id;r.driverName=user.name;r.driverRating=4.9;r.progress=0;set(RK,all);renderDriver();
  });
}

const sid=localStorage.getItem(SK);
const u=users().find(x=>String(x.id)===sid);
u?openApp(u):showAuth();
})();
</script>
</body>
</html>
